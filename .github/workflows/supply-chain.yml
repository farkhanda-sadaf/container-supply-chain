name: build-scan-sign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push the image to GitHub Container Registry
  id-token: write   # keyless signing with Sigstore (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Generate SBOM (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - uses: sigstore/cosign-installer@v3

      - name: Sign image and attach SBOM attestation (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: Verify signature and SBOM attestation
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          ID: https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@refs/heads/main
        run: |
          cosign verify "$REF" \
            --certificate-identity "$ID" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "$ID" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
